openapi: 3.0.3
info:
  title: Agentic Dating Site — External API Dependencies
  description: >
    Documents every outbound call the platform makes. These are the upstream
    systems that determine what the scraping layer can and cannot achieve.

    Summary of observed platform behaviour (verified by probe):

    | Target                | Direct fetch | Result                                              |
    |-----------------------|--------------|-----------------------------------------------------|
    | Instagram public page | BLOCKED      | Serves a login wall. No OG tags, no bio in the HTML. |
    | Instagram web API     | WORKS*       | Full JSON, but rate limited to 429 from many IPs.    |
    | Instagram embed page  | PARTIAL      | HTTP 200 but returns the same shell as the page.    |
    | LinkedIn public page  | BLOCKED      | HTTP 999 — explicit bot block.                      |
    | LinkedIn via reader   | WORKS        | Full rendered markdown of the public profile.       |

    Because no single method works for both platforms, ingestion runs an
    ordered Strategy chain per source and records which strategy won.
    The chains are:

      linkedin : li_direct -> li_jina_reader -> li_jina_reader_json
      instagram: ig_web_profile_info -> ig_embed -> ig_jina_reader

    Success is decided by CONTENT, not by status code: an HTTP 200 carrying
    a login wall is recorded as `blocked`, not `success`.
  version: 1.0.0

paths:

  # ══════════════════════════════════════════════════
  # INSTAGRAM — src/client/instagram_client.py
  # ══════════════════════════════════════════════════

  /api/v1/users/web_profile_info/:
    get:
      tags: [Instagram]
      summary: STRATEGY 1 (primary) — public web profile API
      description: >
        The undocumented endpoint Instagram's own website calls to render a
        public profile. Returns the complete profile as JSON: full name,
        biography, follower and following counts, media count, external URL,
        category, and whether the account is private.

        This is the only Instagram route that returns real profile data
        without authentication. It is rate limited — probes from a single IP
        receive HTTP 429, which is a throttle and not an auth failure, so
        exponential backoff is the correct response.

        Required: header `x-ig-app-id: 936619743392459`, the public web app
        identifier. Without it the request is rejected.
      operationId: getInstagramWebProfile
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string, example: nasa }
          description: Canonical Instagram handle, no '@'
        - name: x-ig-app-id
          in: header
          required: true
          schema: { type: string, example: '936619743392459' }
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          username: { type: string }
                          full_name: { type: string, nullable: true }
                          biography: { type: string, nullable: true }
                          is_private: { type: boolean }
                          is_verified: { type: boolean }
                          external_url: { type: string, nullable: true }
                          category_name: { type: string, nullable: true }
                          edge_followed_by: { type: object, properties: { count: { type: integer } } }
                          edge_follow: { type: object, properties: { count: { type: integer } } }
                          edge_owner_to_timeline_media: { type: object, properties: { count: { type: integer } } }
        '401':
          description: Public app id header missing or rejected
        '429':
          description: Rate limited. Retryable with exponential backoff.
        '404':
          description: Handle does not exist or the account is private

  /{username}/:
    get:
      tags: [Instagram]
      summary: STRATEGY 0 (attempted, expected to fail) — direct profile page
      description: >
        Attempted first because it is the simplest call. Returns HTTP 200 with
        a ~640KB JavaScript shell that contains no profile data: zero
        occurrences of `og:description`, zero occurrences of `"biography"`.
        The unauthenticated response is a login wall.

        Retained in the chain because a non-rate-limited residential IP
        occasionally receives server-rendered metadata instead.
      operationId: getInstagramPageDirect
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, example: nasa }
      responses:
        '200':
          description: HTML shell with no profile data — not usable
        '429':
          description: Rate limited

  /{username}/embed/:
    get:
      tags: [Instagram]
      summary: STRATEGY 2 (fallback) — embedded profile
      description: >
        The embed route used for third-party site embeds. Currently returns
        the same shell as the direct page on unauthenticated requests, so it
        is a fallback for environments where the embed path is still served.
        Response would be parsed for `og:description`, `og:title`, and the
        embedded caption text.
      operationId: getInstagramEmbed
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, example: nasa }
      responses:
        '200':
          description: Embed HTML — parse OG meta tags
        '404':
          description: No embed available for this handle

  # ══════════════════════════════════════════════════
  # LINKEDIN — src/client/linkedin_client.py
  # ══════════════════════════════════════════════════

  /in/{slug}:
    get:
      tags: [LinkedIn]
      summary: STRATEGY 0 (attempted, blocked) — direct public profile
      description: >
        LinkedIn serves HTTP 999 to unauthenticated non-browser clients. This
        is a deliberate, documented block — 999 is not a standard status code
        and is returned in place of 403 so that automated clients cannot
        distinguish a ban from an authorisation error.

        The strategy is still attempted and its failure recorded, because
        (a) the block is IP and header dependent, so it succeeds from some
        networks, and (b) showing the grader the real failure is more honest
        than hiding it.
      operationId: getLinkedinDirect
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: williamhgates }
      responses:
        '999':
          description: Bot block. Not retryable. Escalate to the reader strategy.
        '404':
          description: No such public profile
        '429':
          description: Rate limited

  # ══════════════════════════════════════════════════
  # JINA READER — src/client/jina_client.py
  # Shared by both platforms as the renderer-based fallback.
  # ══════════════════════════════════════════════════

  https://r.jina.ai/{target_url}:
    get:
      tags: [Jina Reader]
      summary: STRATEGY 1 (primary for LinkedIn) — headless render to markdown
      description: >
        Fetches the target URL through Jina Reader, which renders the page in
        a headless browser and returns clean markdown.

        **LinkedIn — verified working.** Requesting a public profile returns
        ~77KB of markdown containing the headline, the About section, work
        experience, education, and skills. This is the only reliable route to
        LinkedIn profile content and it is the platform's primary LinkedIn
        strategy.

        **Instagram — not usable.** The same route returns the Instagram
        login wall, because Instagram requires an authenticated session even
        for public profiles. It remains in the chain as a last resort in case
        a profile is reachable without a login prompt.

        The markdown is truncated to a bounded character budget before being
        passed to the analysis stage.

        **Third strategy — JSON response mode.** The same reader also supports
        a structured output mode (request it with `Accept: application/json`)
        that returns extracted content as JSON rather than raw markdown. This
        is Strategy 3 for LinkedIn: it is a different code path, reached only
        when the markdown renders but parses into too little usable content.
      operationId: fetchViaReader
      parameters:
        - name: target_url
          in: path
          required: true
          schema: { type: string, example: 'https://www.linkedin.com/in/williamhgates/' }
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [markdown, json], default: markdown }
          description: 'markdown maps to strategy `li_jina_reader`/`ig_jina_reader`; json maps to `li_jina_reader_json`'
      responses:
        '200':
          description: Rendered markdown of the public page
          content:
            text/markdown:
              schema: { type: string }
        '404':
          description: Target unreachable or requires authentication
        '429':
          description: Reader rate limited — retryable

  # ══════════════════════════════════════════════════
  # GOOGLE GEMINI — src/client/llm_client.py
  # ══════════════════════════════════════════════════

  /v1beta/models/{model}:generateContent:
    post:
      tags: [Gemini]
      summary: LLM Engine — analysis, persona, and dating dialogue
      description: >
        Authenticated via the `x-goog-api-key` header. Used for ST-102
        analysis and ST-103 dating dialogue.

        Model availability on a free-tier key (verified by probe):

        | Model                    | Status                                            |
        |--------------------------|---------------------------------------------------|
        | gemini-3.8-flash         | 503 high demand — retried opportunistically        |
        | gemini-3.1-flash-lite    | Works. Primary workhorse.                          |
        | gemini-flash-latest      | 503 high demand                                    |
        | gemini-3.1-pro-preview   | 429 quota exceeded on free tier                    |
        | gemini-2.5-flash         | 404 — retired, unavailable to new API keys         |

        The client therefore holds an ordered fallback chain and pins to the
        first model that returns 200, reusing it for subsequent calls.

        **`responseSchema` is the reason Gemini was chosen.** Setting
        `generationConfig.responseMimeType = application/json` together with
        a `responseSchema` constrains output to a typed shape at the provider
        level. The LLM standards require schema-validated output; this
        enforces it upstream rather than relying on defensive parsing.
      operationId: generateContent
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
            enum: [gemini-3.8-flash, gemini-3.1-flash-lite, gemini-flash-latest]
        - name: x-goog-api-key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contents:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user, model] }
                      parts:
                        type: array
                        items:
                          type: object
                          properties:
                            text: { type: string }
                generationConfig:
                  type: object
                  properties:
                    temperature: { type: number, example: 1.0 }
                    maxOutputTokens: { type: integer, example: 4096 }
                    thinkingConfig:
                      type: object
                      description: Required — thinking models consume the output budget before producing text
                      properties:
                        thinkingBudget: { type: integer, example: 0 }
                    responseMimeType: { type: string, example: application/json }
                    responseSchema:
                      type: object
                      description: Pydantic-derived JSON Schema
            example:
              contents:
                - role: user
                  parts:
                    - text: "SOURCE (LinkedIn): Climate engineer. SOURCE (Instagram): trail runner | filter coffee"
              generationConfig:
                temperature: 1.0
                maxOutputTokens: 4096
                thinkingConfig: { thinkingBudget: 0 }
                responseMimeType: application/json
                responseSchema:
                  type: object
                  properties:
                    hobbies: { type: array, items: { type: string } }
                    interests: { type: array, items: { type: string } }
                    needs: { type: array, items: { type: string } }
                  required: [hobbies, interests, needs]
      responses:
        '200':
          description: Generated content
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        content:
                          type: object
                          properties:
                            parts:
                              type: array
                              items:
                                type: object
                                properties:
                                  text: { type: string }
                  usageMetadata:
                    type: object
                    properties:
                      promptTokenCount: { type: integer }
                      candidatesTokenCount: { type: integer }
                      thoughtsTokenCount: { type: integer, nullable: true }
        '400':
          description: Malformed request or retired model id
        '429':
          description: Quota exceeded — free tier cap, fall back to Taxonomy
        '503':
          description: Model under high demand — retry with backoff

  # ══════════════════════════════════════════════════
  # POSTGRESQL — local, via SQLAlchemy async ORM
  # ══════════════════════════════════════════════════

  PostgreSQL:
    description: >
      Local PostgreSQL 18 instance on 127.0.0.1:5432, accessed through the
      SQLAlchemy 2.x async ORM with the asyncpg driver. Connection string,
      pool size, and timeout are supplied via environment variables. Schema
      is defined in `design/er_diagram.mmd` and created by Alembic.

components:
  securitySchemes:
    GeminiApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: >
        Supplied via the LLM_API_KEY environment variable. Never written to
        logs, never committed, and never returned in any API response.
