openapi: 3.0.3
info:
  title: Agentic Dating Site — External API Dependencies
  description: >
    Documents every outbound call the platform makes, and — more usefully —
    records what each one actually returned when it was probed. These probes
    were run from a residential IP on 2026-09-29 and are the reason the
    strategy chains look the way they do.

    The headline finding: **the obvious way in does not work, and the
    non-obvious way in works for only one of the two platforms.**

    | Target                | Plain HTTP fetch            | Headless browser render    |
    |-----------------------|-----------------------------|----------------------------|
    | Instagram public page | BLOCKED — 640KB shell, zero `og:description`, zero `"biography"` | **WORKS** — real biography, name, follower counts |
    | Instagram web API     | 429 sustained at 1 req/20s  | n/a                        |
    | Instagram embed page  | 200, same shell, no data    | n/a                        |
    | LinkedIn public page  | BLOCKED — HTTP 999          | BLOCKED — `Sign Up \| LinkedIn` authwall |
    | LinkedIn via reader   | 200 with API key; 403 Cloudflare challenge without one | still challenged |

    Consequences encoded in the design:

      linkedin : li_jina_reader -> li_direct -> li_browser_render
      instagram: ig_browser_render -> ig_web_profile_info -> ig_embed -> ig_jina_reader

    Two rules follow from the probes and are enforced in code:

      1. Success is decided by CONTENT, not status code. An HTTP 200
         carrying a login wall is recorded as `blocked`, not `success`.
      2. Every attempt is recorded, including skipped and failed ones, so
         "we could not read this" is always explainable.
  version: 1.0.0

paths:

  # ══════════════════════════════════════════════════
  # RENDERER — Playwright over the host's installed Chromium
  # src/client/render_client.py
  # ══════════════════════════════════════════════════

  render:
    post:
      tags: [Renderer]
      summary: STRATEGY 1 (primary) for Instagram — headless render
      description: >
        Navigates a real browser to the target URL, waits for the page to
        hydrate, and returns the rendered HTML. This is the only route that
        returns Instagram profile data on a throttled network, and it is the
        single most important finding of the probing work.

        Playwright drives the Chromium **already installed on the host**
        (Edge on Windows, system Chrome elsewhere) via `channel`, so no
        browser download is needed and the deployment image stays small.

        Data is read from the embedded JSON island that Instagram's own
        frontend hydrates — `"biography"`, `"full_name"`, follower counts —
        rather than from CSS selectors, so extraction survives layout
        changes.

        Costs 6-8s per page and roughly 1000x the memory of an HTTP request,
        which is why it runs under its own `asyncio.Semaphore(2)` with a
        shared browser and a bounded page pool.
      operationId: renderPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: 'https://www.instagram.com/nasa/' }
                wait_for: { type: string, default: 'body' }
                timeout_ms: { type: integer, default: 30000 }
      responses:
        '200':
          description: Rendered HTML
          content:
            text/html:
              schema: { type: string }
        '000':
          description: Navigation timeout, DNS failure, or browser launch failure

  # ══════════════════════════════════════════════════
  # INSTAGRAM — src/client/instagram_client.py
  # ══════════════════════════════════════════════════

  /api/v1/users/web_profile_info/:
    get:
      tags: [Instagram]
      summary: STRATEGY 2 — public web profile API
      description: >
        The undocumented endpoint Instagram's own website calls to render a
        public profile. Returns the complete profile as JSON: full name,
        biography, follower and following counts, media count, external URL,
        category, and whether the account is private.

        Returns real data when the caller's IP is not throttled, and is
        roughly 100x cheaper than a browser render — so on a clean network
        it is the better primary, and the chain order is configurable by
        environment variable. On the probe IP it returned 429 consistently,
        including at one request per 20 seconds over several minutes, so
        there it is a fallback rather than a primary.

        Required: header `x-ig-app-id: 936619743392459`, the public web app
        identifier.
      operationId: getInstagramWebProfile
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string, example: nasa }
          description: Canonical Instagram handle, no '@'
        - name: x-ig-app-id
          in: header
          required: true
          schema: { type: string, example: '936619743392459' }
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          username: { type: string }
                          full_name: { type: string, nullable: true }
                          biography: { type: string, nullable: true }
                          is_private: { type: boolean }
                          is_verified: { type: boolean }
                          external_url: { type: string, nullable: true }
                          category_name: { type: string, nullable: true }
                          edge_followed_by: { type: object, properties: { count: { type: integer } } }
                          edge_follow: { type: object, properties: { count: { type: integer } } }
                          edge_owner_to_timeline_media: { type: object, properties: { count: { type: integer } } }
        '401':
          description: Public app id header missing or rejected
        '429':
          description: Rate limited. Retryable with exponential backoff, but persistent if the IP is throttled.
        '404':
          description: Handle does not exist or the account is private

  /{username}/:
    get:
      tags: [Instagram]
      summary: Strategy (not in chain) — direct profile page over plain HTTP
      description: >
        Recorded because it was the original assumption and it is worth
        documenting why it failed. Returns HTTP 200 with a ~640KB JavaScript
        shell containing **zero** occurrences of `og:description` and **zero**
        occurrences of `"biography"` — the unauthenticated response is a
        login wall.

        This is exactly why the chain uses a browser render instead: the
        profile data is not in the server response at all, it only exists
        after client-side JavaScript runs.
      operationId: getInstagramPageDirect
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, example: nasa }
      responses:
        '200':
          description: HTML shell with no profile data — not usable over plain HTTP
        '429':
          description: Rate limited

  /{username}/embed/:
    get:
      tags: [Instagram]
      summary: STRATEGY 3 — embedded profile
      description: >
        The embed route used for third-party site embeds. On probe it
        returned the same ~640KB shell as the direct page with no profile
        data, so it is retained as a cheap third attempt rather than a
        serious candidate. Response would be parsed for `og:description`,
        `og:title`, and embedded caption text.
      operationId: getInstagramEmbed
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, example: nasa }
      responses:
        '200':
          description: Embed HTML — parse OG meta tags
        '404':
          description: No embed available for this handle

  # ══════════════════════════════════════════════════
  # LINKEDIN — src/client/linkedin_client.py
  # ══════════════════════════════════════════════════

  /in/{slug}:
    get:
      tags: [LinkedIn]
      summary: STRATEGY 2 — direct public profile
      description: >
        LinkedIn serves HTTP 999 to unauthenticated non-browser clients.
        This is a deliberate, documented block — 999 is not a standard status
        code and is returned in place of 403 so automated clients cannot
        distinguish a ban from an authorisation error.

        The strategy is still attempted and its failure recorded, because
        the block is IP- and header-dependent, so it succeeds from some
        networks.
      operationId: getLinkedinDirect
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: williamhgates }
      responses:
        '999':
          description: Bot block. Not retryable. Escalate to the next strategy.
        '404':
          description: No such public profile
        '429':
          description: Rate limited

  # ══════════════════════════════════════════════════
  # JINA READER — src/client/jina_client.py
  # Primary LinkedIn strategy. REQUIRED API KEY.
  # ══════════════════════════════════════════════════

  https://r.jina.ai/{target_url}:
    get:
      tags: [Jina Reader]
      summary: STRATEGY 1 (primary for LinkedIn) — render to markdown
      description: >
        Fetches the target URL through Jina Reader, which renders the page in
        a headless browser and returns clean markdown.

        **LinkedIn — works, with an API key.** Requesting a public profile
        returned ~77KB of markdown containing the headline, the About
        section, work experience, education, and skills.

        **Without a key it is unusable.** Anonymous access is throttled by a
        Cloudflare interstitial: HTTP 403 with a "Just a moment..." body. It
        does not clear on retry, does not clear after a 60-second cooldown,
        and does not clear in a real browser — a browser loaded the challenge
        page and sat on "Performing security verification". The block was
        triggered by exhausting the anonymous quota with a burst of requests,
        so the mitigation is a key, not patience.

        `JINA_API_KEY` is therefore a hard requirement for LinkedIn
        ingestion. When it is unset the strategy records `skipped` with the
        reason, and the chain continues — it is never silently dropped.

        **Instagram — not usable.** The same route returns the Instagram
        login wall, because Instagram requires an authenticated session even
        for public profiles. It remains last in the Instagram chain as a
        fallback in case a profile is reachable without a login prompt.
      operationId: fetchViaReader
      parameters:
        - name: target_url
          in: path
          required: true
          schema: { type: string, example: 'https://www.linkedin.com/in/williamhgates/' }
        - name: Authorization
          in: header
          required: true
          schema: { type: string, example: 'Bearer jina_...' }
          description: Omit to receive the Cloudflare challenge instead
      responses:
        '200':
          description: Rendered markdown of the public page
          content:
            text/markdown:
              schema: { type: string }
        '401':
          description: Search endpoint requires a key; anonymous quota exhausted
        '403':
          description: Cloudflare interstitial — anonymous quota exhausted
        '404':
          description: Target unreachable or requires authentication
        '429':
          description: Reader rate limited — retryable

  # ══════════════════════════════════════════════════
  # GOOGLE GEMINI — src/client/llm_client.py
  # ══════════════════════════════════════════════════

  /v1beta/models/{model}:generateContent:
    post:
      tags: [Gemini]
      summary: LLM Engine — analysis, persona, and dating dialogue
      description: >
        Authenticated via the `x-goog-api-key` header. Used for ST-102
        analysis and ST-103 dating dialogue.

        Model availability on a free-tier key (verified by probe):

        | Model                    | Status                                            |
        |--------------------------|---------------------------------------------------|
        | gemini-3.8-flash         | 503 high demand — retried opportunistically        |
        | gemini-3.1-flash-lite    | Works. Primary workhorse.                          |
        | gemini-flash-latest      | 503 high demand                                    |
        | gemini-3.1-pro-preview   | 429 quota exceeded on free tier                    |
        | gemini-2.5-flash         | 404 — retired, unavailable to new API keys         |

        The client therefore holds an ordered fallback chain and pins to the
        first model that returns 200, reusing it for subsequent calls.

        **`responseSchema` is the reason Gemini was chosen.** Setting
        `generationConfig.responseMimeType = application/json` together with
        a `responseSchema` constrains output to a typed shape at the provider
        level. The LLM standards require schema-validated output; this
        enforces it upstream rather than relying on defensive parsing.
      operationId: generateContent
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
            enum: [gemini-3.8-flash, gemini-3.1-flash-lite, gemini-flash-latest]
        - name: x-goog-api-key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contents:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user, model] }
                      parts:
                        type: array
                        items:
                          type: object
                          properties:
                            text: { type: string }
                generationConfig:
                  type: object
                  properties:
                    temperature: { type: number, example: 1.0 }
                    maxOutputTokens: { type: integer, example: 4096 }
                    thinkingConfig:
                      type: object
                      description: Required — thinking models consume the output budget before producing text
                      properties:
                        thinkingBudget: { type: integer, example: 0 }
                    responseMimeType: { type: string, example: application/json }
                    responseSchema:
                      type: object
                      description: Pydantic-derived JSON Schema
            example:
              contents:
                - role: user
                  parts:
                    - text: "SOURCE (LinkedIn): Climate engineer. SOURCE (Instagram): trail runner | filter coffee"
              generationConfig:
                temperature: 1.0
                maxOutputTokens: 4096
                thinkingConfig: { thinkingBudget: 0 }
                responseMimeType: application/json
                responseSchema:
                  type: object
                  properties:
                    hobbies: { type: array, items: { type: string } }
                    interests: { type: array, items: { type: string } }
                    needs: { type: array, items: { type: string } }
                  required: [hobbies, interests, needs]
      responses:
        '200':
          description: Generated content
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        content:
                          type: object
                          properties:
                            parts:
                              type: array
                              items:
                                type: object
                                properties:
                                  text: { type: string }
                  usageMetadata:
                    type: object
                    properties:
                      promptTokenCount: { type: integer }
                      candidatesTokenCount: { type: integer }
                      thoughtsTokenCount: { type: integer, nullable: true }
        '400':
          description: Malformed request or retired model id
        '429':
          description: Quota exceeded — free tier cap, fall back to Taxonomy
        '503':
          description: Model under high demand — retry with backoff

  # ══════════════════════════════════════════════════
  # POSTGRESQL — local, via SQLAlchemy async ORM
  # ══════════════════════════════════════════════════

  PostgreSQL:
    description: >
      Local PostgreSQL 18 instance on 127.0.0.1:5432, accessed through the
      SQLAlchemy 2.x async ORM with the asyncpg driver. Connection string,
      pool size, and timeout are supplied via environment variables. Schema
      is defined in `design/er_diagram.mmd` and created by Alembic.

components:
  securitySchemes:
    JinaApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: >
        Supplied as `Bearer $JINA_API_KEY`. Required for LinkedIn ingestion —
        anonymous reader access is throttled by a Cloudflare interstitial
        that does not clear. Never logged, never committed.
    GeminiApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: >
        Supplied via the LLM_API_KEY environment variable. Never written to
        logs, never committed, and never returned in any API response.
